name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-backend:
    name: Test Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: services/backend
        run: uv sync --locked

      - name: Run unit tests
        working-directory: services/backend
        run: uv run --no-sync pytest
